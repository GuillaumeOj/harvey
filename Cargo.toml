[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"
publish = false

[workspace.dependencies]
harvey-db = { path = "crates/harvey-db" }
harvey-core = { path = "crates/harvey-core" }
harvey-calendar = { path = "crates/harvey-calendar" }
harvey-backup = { path = "crates/harvey-backup" }
harvey-ffi = { path = "crates/harvey-ffi" }
harvey-swift-bridge = { path = "crates/harvey-swift-bridge" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.cargo]
# Skeleton crates declare their final dependency direction before any code uses it.
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
needless_pass_by_value = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
