localok = { path = "crates/x" }

[dependencies]
bare = "1.0.0"

[dev-dependencies]
devdep = "~1.0.0"

[build-dependencies]
builddep = { version = ">=1.0.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1" }

[dependencies.dotted]
version = "1"
