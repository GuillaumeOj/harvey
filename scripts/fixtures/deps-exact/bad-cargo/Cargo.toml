[workspace.dependencies]
range = "1.0"
caret = "^1.0.0"
nopatch = "=1.2"
tablerange = { version = "1.2", features = ["a"] }
gitdep = { git = "https://github.com/a/b" }
branch = { git = "https://github.com/a/b", branch = "main" }
reg = { version = "=1.0.0", registry = "internal" }
noversion = { features = ["a"] }
