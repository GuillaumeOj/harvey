[package]
name = "harvey-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "harvey_app"

[features]
fake-platform = ["harvey-core/fake-platform", "harvey-swift-bridge/fake-platform"]

[dependencies]
harvey-core = { workspace = true }
harvey-swift-bridge = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
# Default features only: never `devtools`, and no `tauri-plugin-*` crate (§6.10).
tauri = { workspace = true }
tauri-specta = { workspace = true }

[dev-dependencies]
# Bindings are exported by a test only, never at app start-up.
serde_json = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true, features = ["typescript"] }

[build-dependencies]
tauri-build = { workspace = true }
